---

- name: Preflight
  ansible.builtin.include_tasks:
    file: preflight.yml

- name: Install vault
  ansible.builtin.include_tasks:
    file: install.yml

- name: Configure vault
  ansible.builtin.include_tasks:
    file: configure.yml

- name: Status vault
  ansible.builtin.include_tasks:
    file: status.yml

- name: Leader
  ansible.builtin.include_tasks:
    file: leader.yml
  when:
    - inventory_hostname == vault_leader

- name: Follower
  ansible.builtin.include_tasks:
    file: follower.yml
  when:
    - inventory_hostname != vault_leader

- name: Backup
  ansible.builtin.include_tasks:
    file: backup.yml
  when:
    - not vault_backup_disable
